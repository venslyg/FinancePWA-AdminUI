events{

}

http {
    server {
        listen 80;

         listen [::]:80;
        # server_name localhost;

        # root /usr/share/nginx/html/;
        # index index.html;



        # Proxy API requests
        location /api/ {
            proxy_pass http://173.249.9.238:9090/api/;
            add_header 'Access-Control-Allow-Origin' '*' always;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
        }

        location /management/ {
            proxy_pass http://173.249.9.238:9090/management/;
            add_header 'Access-Control-Allow-Origin' '*' always;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
        }

        location /realms/ {
            proxy_pass http://173.249.9.238:9090/realms/;
            add_header 'Access-Control-Allow-Origin' '*' always;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
        }

        location /services/ {
            proxy_pass http://173.249.9.238:9090/services/;
            add_header 'Access-Control-Allow-Origin' '*' always;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
         }

    }
}

<!-- Reusable form component template -->
<form class="flex h-full flex-col" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="flex items-center justify-between border-b pb-4">
    <h2 class="text-2xl font-bold">
      {{ heading || (isEditMode ? 'Edit SalaryPayout' : 'New SalaryPayout') }}
    </h2>
    <mat-icon *ngIf="isSaving" class="animate-spin">autorenew</mat-icon>
  </div>

  <div class="flex-auto space-y-4 overflow-y-auto pt-6">
    
      
    <mat-form-field class="w-full">
      <mat-label>BranchCode</mat-label>
      <input matInput formControlName="branchCode" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>SalaryPayoutCode</mat-label>
      <input matInput formControlName="salaryPayoutCode" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>StaffCode</mat-label>
      <input matInput formControlName="staffCode" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>PayPeriod</mat-label>
      <input matInput formControlName="payPeriod" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>BaseSalary</mat-label>
      <input matInput formControlName="baseSalary" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Allowances</mat-label>
      <input matInput formControlName="allowances" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Deductions</mat-label>
      <input matInput formControlName="deductions" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>NetPay</mat-label>
      <input matInput formControlName="netPay" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>PayoutDate</mat-label>
      <input matInput [matDatepicker]="pickerpayoutDate" formControlName="payoutDate">
      <mat-datepicker-toggle matSuffix [for]="pickerpayoutDate"></mat-datepicker-toggle>
      <mat-datepicker #pickerpayoutDate></mat-datepicker>
    </mat-form-field></div>

  <div *ngIf="errorMessage" class="mt-2 rounded bg-warn-100 px-4 py-2 text-warn-900">
    {{ errorMessage }}
  </div>

  <div class="mt-6 flex items-center justify-end border-t pt-6">
    <button type="button" mat-button (click)="onCancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" class="ml-3" [disabled]="form.invalid || isSaving">
      <span *ngIf="!isSaving">Save</span>
      <span *ngIf="isSaving">Saving…</span>
    </button>
  </div>
</form>

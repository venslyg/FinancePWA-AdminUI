<!-- Reusable form component template -->
<form class="flex flex-col h-full" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="flex items-center justify-between pb-4 border-b">
    <h2 class="text-2xl font-bold">
      {{ heading || (isEditMode ? 'Edit Expense Category' : 'New Expense Category') }}
    </h2>
    <mat-icon *ngIf="isSaving" class="animate-spin">autorenew</mat-icon>
  </div>

  <div class="flex-auto pt-6 space-y-4 overflow-y-auto">
    
      
    <mat-form-field class="w-full">
      <mat-label>Category Code</mat-label>
      <input matInput formControlName="categoryCode" readonly>
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Category Name</mat-label>
      <input matInput formControlName="categoryName" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" >
    </mat-form-field></div>

  <div *ngIf="errorMessage" class="px-4 py-2 mt-2 rounded bg-warn-100 text-warn-900">
    {{ errorMessage }}
  </div>

  <div class="flex items-center justify-end pt-6 mt-6 border-t">
    <button type="button" mat-button (click)="onCancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" class="ml-3" [disabled]="form.invalid || isSaving">
      <span *ngIf="!isSaving">Save</span>
      <span *ngIf="isSaving">Saving…</span>
    </button>
  </div>
</form>

<!-- This is an EJS template. It generates the HTML for the list component. -->

<mat-drawer-container class="absolute h-full w-full bg-transparent">
  <!-- Main Content (The Table) -->
  <mat-drawer-content class="flex flex-col">
    <div class="absolute inset-0 flex min-w-0 flex-col overflow-hidden">

      <!-- Header -->
      <div class="bg-default dark:bg-transparent flex flex-0 flex-col p-6 pb-22 sm:flex-row sm:items-center sm:justify-between sm:px-10 sm:pb-28 sm:pt-12">
        <div class="min-w-0 flex-1">
          <h2 class="truncate text-3xl font-extrabold leading-7 tracking-tight sm:leading-10 md:text-4xl">
            AccountSet Management
          </h2>
        </div>
        <!-- Actions -->
        <div class="mt-6 flex shrink-0 items-center gap-3 sm:ml-4 sm:mt-0">
          <button *ngIf="filterFields.length" mat-stroked-button type="button" (click)="openFilterDrawer()">
            <mat-icon [svgIcon]="'heroicons_outline:funnel'"></mat-icon>
            <span class="ml-2">Filters</span>
          </button>
          <button mat-flat-button color="primary" type="button" (click)="openFormDrawer()">
            <mat-icon [svgIcon]="'heroicons_mini:plus'"></mat-icon>
            <span class="ml-2">New AccountSet</span>
          </button>
        </div>
      </div>

      <!-- Table Container -->
      <div class="example-table-container bg-card -mt-16 min-h-[24rem] h-full rounded-2xl border border-slate-200 bg-white shadow-sm" style="overflow: auto; width: 100%;">
        <div *ngIf="isLoading" class="flex items-center justify-center p-8">
          <mat-progress-spinner [diameter]="40" [mode]="'indeterminate'"></mat-progress-spinner>
        </div>

        <table mat-table [dataSource]="dataSource" matSort (matSortChange)="loadData()" *ngIf="!isLoading" class="min-w-full text-slate-900">

          <!-- Dynamically generate columns for entity fields -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let element">{{ element.id }}</td>
          </ng-container>
          
          <ng-container matColumnDef="branchCode">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>BranchCode</th>
            
            <td mat-cell *matCellDef="let element">{{ element.branchCode }}</td>
            
          </ng-container>
          
          <ng-container matColumnDef="accountCode">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>AccountCode</th>
            
            <td mat-cell *matCellDef="let element">{{ element.accountCode }}</td>
            
          </ng-container>
          
          <ng-container matColumnDef="accountName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>AccountName</th>
            
            <td mat-cell *matCellDef="let element">{{ element.accountName }}</td>
            
          </ng-container>
          
          <ng-container matColumnDef="accountType">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>AccountType</th>
            
            <td mat-cell *matCellDef="let element">{{ element.accountType }}</td>
            
          </ng-container>
          
          <ng-container matColumnDef="subCategory">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>SubCategory</th>
            
            <td mat-cell *matCellDef="let element">{{ element.subCategory }}</td>
            
          </ng-container>
          
          <ng-container matColumnDef="remark">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Remark</th>
            
            <td mat-cell *matCellDef="let element">{{ element.remark }}</td>
            
          </ng-container>
          

          <!-- Generate columns for "Show Children" buttons -->
          

          <!-- General Actions Column (Edit/Delete) -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button (click)="openFormDrawer(element.id)" matTooltip="Edit AccountSet">
                <mat-icon [svgIcon]="'heroicons_outline:pencil-square'"></mat-icon>
              </button>
              <button mat-icon-button (click)="delete(element.id)" matTooltip="Delete AccountSet">
                <mat-icon class="text-warn" [svgIcon]="'heroicons_outline:trash'"></mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns" class="text-slate-500"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="border-b border-slate-100"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell px-4 py-6 text-center text-slate-500" [attr.colspan]="displayedColumns.length">No data found.</td>
          </tr>
        </table>
      </div>

      <!-- Paginator -->
      <mat-paginator [length]="totalItems" [pageSize]="itemsPerPage" [pageSizeOptions]="[10, 25, 50, 100]" (page)="loadData()"></mat-paginator>
    </div>
  </mat-drawer-content>

  <!-- Side Drawer for Form -->
  <mat-drawer #formDrawer mode="over" position="end" class="w-1/3 min-w-96">
    <div class="flex h-full flex-col bg-card p-6">
      <app-account-set-form
        [entity]="selectedAccountSet"
        [heading]="drawerMode === 'new' ? 'New AccountSet' : 'Edit AccountSet'"
        (saved)="handleFormSaved()"
        (cancelled)="closeFormDrawer()">
      </app-account-set-form>
    </div>
  </mat-drawer>
</mat-drawer-container>

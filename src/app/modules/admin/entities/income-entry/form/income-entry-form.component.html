<!-- Reusable form component template -->
<form class="flex h-full flex-col" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="flex items-center justify-between border-b pb-4">
    <h2 class="text-2xl font-bold">
      {{ heading || (isEditMode ? 'Edit IncomeEntry' : 'New IncomeEntry') }}
    </h2>
    <mat-icon *ngIf="isSaving" class="animate-spin">autorenew</mat-icon>
  </div>

  <div class="flex-auto space-y-4 overflow-y-auto pt-6">
    
      
    <mat-form-field class="w-full">
      <mat-label>BranchCode</mat-label>
      <input matInput formControlName="branchCode" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>AccountCode</mat-label>
      <input matInput formControlName="accountCode" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>IncomeCode</mat-label>
      <input matInput formControlName="incomeCode" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="pickerdate" formControlName="date">
      <mat-datepicker-toggle matSuffix [for]="pickerdate"></mat-datepicker-toggle>
      <mat-datepicker #pickerdate></mat-datepicker>
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>ReceiptNo</mat-label>
      <input matInput formControlName="receiptNo" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>IncomeType</mat-label>
      <mat-select formControlName="incomeType">
        <mat-option *ngFor="let option of incomeTypeOptions" [value]="option">
          {{ option }}
        </mat-option>
      </mat-select>
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Amount</mat-label>
      <input matInput formControlName="amount" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>PaymentMethod</mat-label>
      <mat-select formControlName="paymentMethod">
        <mat-option *ngFor="let option of paymentModeOptions" [value]="option">
          {{ option }}
        </mat-option>
      </mat-select>
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>ReceivablePerson</mat-label>
      <input matInput formControlName="receivablePerson" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>ReceivedBy</mat-label>
      <input matInput formControlName="receivedBy" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>SyncStatus</mat-label>
      <mat-select formControlName="syncStatus">
        <mat-option *ngFor="let option of syncStatusOptions" [value]="option">
          {{ option }}
        </mat-option>
      </mat-select>
    </mat-form-field></div>

  <div *ngIf="errorMessage" class="mt-2 rounded bg-warn-100 px-4 py-2 text-warn-900">
    {{ errorMessage }}
  </div>

  <div class="mt-6 flex items-center justify-end border-t pt-6">
    <button type="button" mat-button (click)="onCancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" class="ml-3" [disabled]="form.invalid || isSaving">
      <span *ngIf="!isSaving">Save</span>
      <span *ngIf="isSaving">Saving…</span>
    </button>
  </div>
</form>

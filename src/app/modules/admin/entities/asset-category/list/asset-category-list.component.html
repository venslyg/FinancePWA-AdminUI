<!-- This is an EJS template. It generates the HTML for the list component. -->

<mat-drawer-container class="absolute w-full h-full bg-transparent">
    <mat-drawer #filterDrawer mode="over" position="start" class="w-full max-w-sm">
    <div class="flex flex-col h-full bg-card">
      <div class="flex items-center justify-between px-6 py-4 border-b">
        <h2 class="text-xl font-semibold">Filters</h2>
        <button mat-icon-button type="button" (click)="closeFilterDrawer()">
          <mat-icon [svgIcon]="'heroicons_mini:x-mark'"></mat-icon>
        </button>
      </div>

      <div class="flex items-center justify-center flex-auto px-6 py-8 text-sm text-center text-slate-500">
        Filtering controls are not configured for this list yet.
      </div>
    </div>
  </mat-drawer><!-- Main Content (The Table) -->
  <mat-drawer-content class="flex flex-col">
    <div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">

      <!-- Header -->
      <div class="flex flex-col p-6 bg-default dark:bg-transparent flex-0 pb-22 sm:flex-row sm:items-center sm:justify-between sm:px-10 sm:pb-28 sm:pt-12">
        <div class="flex-1 min-w-0">
          <h2 class="text-3xl font-extrabold leading-7 tracking-tight truncate sm:leading-10 md:text-4xl">
            Asset Category Management
          </h2>
        </div>
        <!-- Actions -->
        <div class="flex items-center gap-3 mt-6 shrink-0 sm:ml-4 sm:mt-0">
          <button mat-stroked-button type="button" (click)="openFilterDrawer()">
            <mat-icon [svgIcon]="'heroicons_outline:funnel'"></mat-icon>
            <span class="ml-2">Filters</span>
          </button>
          <button mat-flat-button color="primary" type="button" (click)="openFormDrawer()">
            <mat-icon [svgIcon]="'heroicons_mini:plus'"></mat-icon>
            <span class="ml-2">New Asset Category</span>
          </button>
        </div>
      </div>

      <!-- Table Container -->
      <div class="example-table-container bg-card -mt-16 min-h-[24rem] h-full rounded-2xl border border-slate-200 bg-white shadow-sm" style="overflow: auto; width: 100%;">
        <div *ngIf="isLoading" class="flex items-center justify-center p-8">
          <mat-progress-spinner [diameter]="40" [mode]="'indeterminate'"></mat-progress-spinner>
        </div>

        <table mat-table [dataSource]="dataSource" matSort (matSortChange)="loadData()" [hidden]="isLoading" class="min-w-full text-slate-900">

          <!-- Dynamically generate columns for entity fields -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let element">{{ element.id }}</td>
          </ng-container>
          
          <ng-container matColumnDef="assetCategoryCode">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Asset Category Code</th>
            
            <td mat-cell *matCellDef="let element">{{ element.assetCategoryCode }}</td>
            
          </ng-container>
          
          <ng-container matColumnDef="assetCategoryName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Asset Category Name</th>
            
            <td mat-cell *matCellDef="let element">{{ element.assetCategoryName }}</td>
            
          </ng-container>
          
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
            
            <td mat-cell *matCellDef="let element">{{ element.description }}</td>
            
          </ng-container>
          

          <!-- Generate columns for "Show Children" buttons -->
          

          <!-- General Actions Column (Edit/Delete) -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button (click)="openFormDrawer(element.id)" matTooltip="Edit AssetCategory">
                <mat-icon [svgIcon]="'heroicons_outline:pencil-square'"></mat-icon>
              </button>
              <button mat-icon-button (click)="delete(element.id)" matTooltip="Delete AssetCategory">
                <mat-icon class="text-warn" [svgIcon]="'heroicons_outline:trash'"></mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns" class="text-slate-500"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="border-b border-slate-100"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="px-4 py-6 text-center mat-cell text-slate-500" [attr.colspan]="displayedColumns.length">No data found.</td>
          </tr>
        </table>
      </div>

      <!-- Paginator -->
      <mat-paginator [length]="totalItems" [pageSize]="itemsPerPage" [pageSizeOptions]="[10, 25, 50, 100]" (page)="loadData()"></mat-paginator>
    </div>
  </mat-drawer-content>

  <!-- Side Drawer for Form -->
  <mat-drawer #formDrawer mode="over" position="end" class="w-1/3 min-w-96">
    <div class="flex flex-col h-full p-6 bg-card">
      <app-asset-category-form
        [entity]="selectedAssetCategory"
        [heading]="drawerMode === 'new' ? 'New AssetCategory' : 'Edit AssetCategory'"
        (saved)="handleFormSaved()"
        (cancelled)="closeFormDrawer()">
      </app-asset-category-form>
    </div>
  </mat-drawer>
</mat-drawer-container>

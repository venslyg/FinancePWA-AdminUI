<!-- Reusable form component template -->
<form class="flex h-full flex-col" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="flex items-center justify-between border-b pb-4">
    <h2 class="text-2xl font-bold">
      {{ heading || (isEditMode ? 'Edit ChurchStaff' : 'New ChurchStaff') }}
    </h2>
    <mat-icon *ngIf="isSaving" class="animate-spin">autorenew</mat-icon>
  </div>

  <div class="flex-auto space-y-4 overflow-y-auto pt-6">
    
      
    <mat-form-field class="w-full">
      <mat-label>StaffCode</mat-label>
      <input matInput formControlName="staffCode" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>BranchCode</mat-label>
      <input matInput formControlName="branchCode" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>FullName</mat-label>
      <input matInput formControlName="fullName" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Position</mat-label>
      <input matInput formControlName="position" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>StaffType</mat-label>
      <mat-select formControlName="staffType">
        <mat-option *ngFor="let option of staffTypeOptions" [value]="option">
          {{ option }}
        </mat-option>
      </mat-select>
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>ContactNumber</mat-label>
      <input matInput formControlName="contactNumber" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>HourlyRateOrMonthlySalary</mat-label>
      <input matInput formControlName="hourlyRateOrMonthlySalary" >
    </mat-form-field>
      
    
      
    <mat-checkbox class="w-full" formControlName="isActive">
      IsActive
    </mat-checkbox>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>CreatedBy</mat-label>
      <input matInput formControlName="createdBy" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>CreatedDate</mat-label>
      <input matInput [matDatepicker]="pickercreatedDate" formControlName="createdDate">
      <mat-datepicker-toggle matSuffix [for]="pickercreatedDate"></mat-datepicker-toggle>
      <mat-datepicker #pickercreatedDate></mat-datepicker>
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>LastModifiedBy</mat-label>
      <input matInput formControlName="lastModifiedBy" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>LastModifiedDate</mat-label>
      <input matInput [matDatepicker]="pickerlastModifiedDate" formControlName="lastModifiedDate">
      <mat-datepicker-toggle matSuffix [for]="pickerlastModifiedDate"></mat-datepicker-toggle>
      <mat-datepicker #pickerlastModifiedDate></mat-datepicker>
    </mat-form-field>
      
    

    
    
  </div>

  <div *ngIf="errorMessage" class="mt-2 rounded bg-warn-100 px-4 py-2 text-warn-900">
    {{ errorMessage }}
  </div>

  <div class="mt-6 flex items-center justify-end border-t pt-6">
    <button type="button" mat-button (click)="onCancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" class="ml-3" [disabled]="form.invalid || isSaving">
      <span *ngIf="!isSaving">Save</span>
      <span *ngIf="isSaving">Saving…</span>
    </button>
  </div>
</form>
